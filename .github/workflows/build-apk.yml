name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generar APK de Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 📦 Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📥 Instalar dependencias
        run: pnpm install

      - name: 🏗️ Compilar Frontend (dist)
        run: pnpm --filter frontend build

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: ⚡ Sincronizar Capacitor con proyecto Android
        run: |
          cd frontend
          npx cap sync android

      - name: 🔑 Dar permisos de ejecución a gradlew
        run: chmod +x frontend/android/gradlew

      - name: 📱 Compilar APK Debug
        run: |
          cd frontend/android
          ./gradlew assembleDebug

      - name: 📤 Subir APK para descargar directamente
        uses: actions/upload-artifact@v4
        with:
          name: Cobros-MFT-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
